server {
    listen 80;
    listen [::]:80;
    server_name wiki.ezholnin.ru;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /srv/www/sites/wiki/acme;
        try_files $uri =404;
    }

    location / {
        root /srv/www/sites/wiki/current/dist;
        try_files $uri $uri/ $uri/index.html =404;
        error_page 404 /404.html;
    }
}
