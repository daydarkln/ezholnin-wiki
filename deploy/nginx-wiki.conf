server {
    listen 80;
    listen [::]:80;
    server_name wiki.ezholnin.ru;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /srv/www/sites/wiki/acme;
        try_files $uri =404;
    }

    location / {
        return 308 https://wiki.ezholnin.ru$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name wiki.ezholnin.ru;
    server_tokens off;
    root /srv/www/sites/wiki/current/dist;
    index index.html;
    charset utf-8;

    ssl_certificate /etc/letsencrypt/live/wiki.ezholnin.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wiki.ezholnin.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://mc.yandex.ru; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://mc.yandex.ru; connect-src 'self' https://mc.yandex.ru https://mc.yandex.com; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;

    location = /index.html {
        try_files $uri =404;
        expires -1;
    }

    location ^~ /_astro/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
    }

    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }

    location ~ /\. {
        deny all;
    }

    error_page 404 /404.html;
}
